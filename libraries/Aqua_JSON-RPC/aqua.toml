manifest_version = 2
[library]
name = "Aqua_JSON-RPC"
version = "1.0.0"
description = "星泉 JSON-RPC 2.0：雙向端點、批次、標準錯誤，HTTP／WebSocket／TCP（Content-Length）傳輸。JSON-RPC 2.0 endpoints, batches and standard errors over HTTP, WebSocket and TCP (Content-Length framing)."
platforms = ["windows", "linux", "web", "android"]
license = "MIT"
[[modules]]
names = "AquaJSONRPC|星泉遠端呼叫"
source = "main.aqua"
[android]
permissions = ["android.permission.INTERNET"]
