# Runs every example notebook through a running aqua_wellplay server and fails on any error output.
manifest_version = 2

[project]
name = "aqua_wellplay_example_tests"
version = "0.1.0"
entry = "main.aqua"
sources = ["main.aqua"]
platforms = ["windows", "linux"]

[dependencies]
Aqua_JSON-RPC = { path = "../../libraries/Aqua_JSON-RPC", version = "1.0.0" }
